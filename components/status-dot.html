<!-- Requires magi.css and an ancestor with data-magi-theme="amber". -->
<div class="magi-cluster">
  <span class="magi-status" data-tone="success" data-pulse="true">Healthy</span>
  <span class="magi-status" data-tone="warning">Degraded</span>
  <span class="magi-status" data-tone="danger">Down</span>
  <span class="magi-status">Unknown</span>
</div>
