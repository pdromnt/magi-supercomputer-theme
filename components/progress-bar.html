<!-- Requires magi.css and an ancestor with data-magi-theme="amber". -->
<div class="magi-stack" style="--magi-stack-gap: var(--magi-space-5)">
  <div class="magi-progress" style="--magi-progress-value: 23%">
    <div class="magi-progress__label"><span>CPU</span><span>23%</span></div>
    <div class="magi-progress__track"><div class="magi-progress__bar"></div></div>
  </div>
  <div class="magi-progress" data-tone="warning" style="--magi-progress-value: 67%">
    <div class="magi-progress__label"><span>RAM</span><span>67%</span></div>
    <div class="magi-progress__track"><div class="magi-progress__bar"></div></div>
  </div>
  <div class="magi-progress" data-tone="danger" style="--magi-progress-value: 91%">
    <div class="magi-progress__label"><span>Disk</span><span>91%</span></div>
    <div class="magi-progress__track"><div class="magi-progress__bar"></div></div>
  </div>
</div>
